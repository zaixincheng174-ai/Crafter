name: Build pinned SAM3 service
on:
  push:
    branches: [codex-integration]
    paths: [codex/sam3/**, .github/workflows/build-sam3.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: codex/sam3
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zaixincheng174-ai/crafter-sam3:1.0.0-6398457-f1647e8
